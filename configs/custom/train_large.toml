# Gomoku PPO 训练配置文件
# 这个文件统一控制运行参数、训练超参数、评估策略、checkpoint 保留策略，以及 reward 奖惩权重。

[runtime]
# 训练设备。设为 "auto" 时优先使用 CUDA，否则回退到 CPU。
device = "auto"

# 基础随机种子。训练、评估 seed 生成和环境 seed 都以此为起点。
seed = 42

# 所有训练 run 的根目录。每次训练都会在这里创建一个独立子目录。
run_root = "runs"

# 可选的固定 run 名称。留空时自动生成基于时间戳的目录名。
run_name = ""

# 可选的恢复训练 checkpoint 路径。留空表示从头开始训练。
resume_from = ""

# 是否基于 resume_from 开启一个新的训练分支。
# false: 继续写回被加载 checkpoint 所在的 run 目录。
# true: 以该 checkpoint 为起点，在新的 run 目录中继续训练。
start_new_branch = false

# reward 配置文件路径。将奖惩策略单独放到独立 TOML 中维护。
reward_config = "configs/reward.toml"

[training]
# 每次 PPO rollout 使用的并行环境数量。
n_envs = 8

# 每个环境在一次 PPO 更新前收集的步数。
n_steps = 256

# 本次执行要跑多少次 PPO update。
# 如果是恢复训练，这里表示“额外再跑多少次”，不是总 update 数。
updates = 400

# PPO 小批量大小。
batch_size = 1024

# 每次 PPO update 内部的优化轮数。
epochs = 4

# Adam 学习率。
lr = 1e-4

# 是否显示训练进度条和中间输出。
show_progress = true

[model]
# 可选: small / base / large / custom。
# 只有 preset = "custom" 时，下面这些显式参数才会生效；
# 否则会直接使用预设参数。
preset = "base"

# 共享主干通道数。增大后主干和两个 head 的参数量都会上升。
channels = 64

# 残差块数量。增大后主干深度和参数量上升。
blocks = 4

# policy head 的 1x1 卷积输出通道数。
policy_channels = 2

# value head 的 1x1 卷积输出通道数。
value_channels = 1

# value head 隐藏层宽度。
value_hidden_dim = 128

[evaluation]
# 每隔多少个 update 做一次评估。设为 0 表示关闭周期性评估。
eval_every = 10

# 每个评估 seed 下对战的局数。
eval_games = 20

# 联合评估时使用多少个不同 seed。
eval_seeds = 3

[artifacts]
# run 目录下用于保存 TensorBoard 日志的相对目录名。
tensorboard_dir = "tensorboard"

# run 目录下用于保存周期 checkpoint 的相对目录名。
checkpoint_dir = "checkpoints"

# 训练结束时最终模型文件名。
final_model_name = "final_model.pt"

# 最近一次评估结果的 JSON 文件名。
latest_eval_name = "latest_eval.json"

# 当前 run 的清单文件名。
manifest_name = "manifest.json"

[checkpoint]
# 每隔多少个 update 保存一个周期 checkpoint。设为 0 表示关闭。
save_every = 10

# 是否根据联合评估结果额外保留一个 best_model 文件。
keep_best_model = true

# 开启 keep_best_model 时使用的文件名。
best_model_name = "best_model.pt"

# 是否在训练结束时保留最终模型文件。
keep_final_model = true

# 最多保留最近多少个周期 checkpoint。设为 0 表示不删除。
keep_last = 5

# 里程碑 checkpoint 的保留间隔。设为 0 表示关闭里程碑保留。
keep_milestone_every = 100
