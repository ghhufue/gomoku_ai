# Gomoku PPO 训练配置文件
# 统一控制运行参数、训练超参数、checkpoint 保留策略。
# Reward → --reward-config (默认 configs/reward.toml)
# 评估   → --eval-config   (默认 configs/eval.toml)

[runtime]
# 训练设备。设为 "auto" 时优先使用 CUDA，否则回退到 CPU。
device = "auto"

# 基础随机种子。训练、评估 seed 生成和环境 seed 都以此为起点。
seed = 42

# 所有训练 run 的根目录。每次训练都会在这里创建一个独立子目录。
run_root = "runs"

# 可选的固定 run 名称。留空时自动生成基于时间戳的目录名。
run_name = ""

# 可选的恢复训练 checkpoint 路径。留空表示从头开始训练。
resume_from = ""

# 是否基于 resume_from 开启一个新的训练分支。
# false: 继续写回被加载 checkpoint 所在的 run 目录。
# true: 以该 checkpoint 为起点，在新的 run 目录中继续训练。
start_new_branch = false

[training]
# 采样使用的 worker 进程数。实际总环境数 = worker_processes * envs_per_worker。
worker_processes = 12

# 每个 worker 进程内部创建的环境数。
envs_per_worker = 2

# 每个环境在一次 PPO 更新前收集的步数。
n_steps = 128

# 本次执行要跑多少次 PPO update。
# 如果是恢复训练，这里表示"额外再跑多少次"，不是总 update 数。
updates = 4000

# PPO 小批量大小。
batch_size = 384

# 每次 PPO update 内部的优化轮数。
epochs = 4

# Adam 学习率。
lr = 0.0001

# 是否显示训练进度条和中间输出。
show_progress = true

[model]
# 可选: small / base / large / custom。
preset = "base"

# 模型输入通道数。4 通道: 当前玩家棋子、对手棋子、上一手落点、当前玩家是否为黑棋。
input_channels = 4

# 共享主干通道数。增大后主干和两个 head 的参数量都会上升。
channels = 64

# 残差块数量。增大后主干深度和参数量上升。
blocks = 6

# policy head 的 1x1 卷积输出通道数。
policy_channels = 2

# value head 的 1x1 卷积输出通道数。
value_channels = 1

# value head 隐藏层宽度。
value_hidden_dim = 128

[opponent]
# 默认对手 bot 名称。
bot_name = "reward_driven_hard"

# 默认对手 bot 难度（为空时使用 bot_name）。
bot_difficulty = ""

# === 对手池配置 ===
# 训练时从池中按权重随机选择对手。
# 为空表示只使用 bot_name 指定的固定对手。
opponent_pool_names = ["random", "classic_rule", "reward_driven_medium", "reward_driven_hard"]

# 初始权重。当 dynamic.enabled=true 时，权重会被动态调整覆盖。
opponent_pool_weights = [0.4, 0.4, 0.15, 0.05]

# === 动态对手 ===
# 根据棋力评分自动调整各 bot 出现概率。
# 评分来源：最近一次 strength evaluation 的 normalized_strength_score_0_100。
[opponent.dynamic]
enabled = true

# 分数段 → 各 bot 出现概率。
# score 范围为 [0, 100]，分段左闭右开。
# 当前分数落在某段时使用该段的 weights。
# 设计原则：低分段多给简单 bot，但随着分数提高提前引入少量更难 bot，
# 确保模型在能稳定打败某级 bot 之前就已经接触过更难的对手。

[[opponent.dynamic.tiers]]
score_max = 10
weights = [0.50, 0.40, 0.08, 0.02]

[[opponent.dynamic.tiers]]
score_max = 25
weights = [0.20, 0.35, 0.30, 0.15]

[[opponent.dynamic.tiers]]
score_max = 45
weights = [0.05, 0.20, 0.40, 0.35]

[[opponent.dynamic.tiers]]
score_max = 70
weights = [0.00, 0.10, 0.35, 0.55]

[[opponent.dynamic.tiers]]
score_max = 100
weights = [0.00, 0.05, 0.20, 0.75]

# 初始 tier 的 score 值。训练刚开始时还没有 strength eval 结果，使用此值。
initial_score = 5.0

[artifacts]
# run 目录下用于保存 TensorBoard 日志的相对目录名。
tensorboard_dir = "tensorboard"

# run 目录下用于保存周期 checkpoint 的相对目录名。
checkpoint_dir = "checkpoints"

# run 目录下用于保存中间训练历史与分析数据的相对目录名。
history_dir = "history"

# 训练结束时最终模型文件名。
final_model_name = "final_model.pt"

# 最近一次评估结果的 JSON 文件名。
latest_eval_name = "latest_eval.json"

# 当前 run 的清单文件名。
manifest_name = "manifest.json"

[checkpoint]
# 每隔多少个 update 保存一个周期 checkpoint。设为 0 表示关闭。
save_every = 10

# 是否根据联合评估结果额外保留一个 best_model 文件。
keep_best_model = true

# 开启 keep_best_model 时使用的文件名。
best_model_name = "best_model.pt"

# 是否在训练结束时保留最终模型文件。
keep_final_model = true

# 最多保留最近多少个周期 checkpoint。设为 0 表示不删除。
keep_last = 5

# 里程碑 checkpoint 的保留间隔。设为 0 表示关闭里程碑保留。
keep_milestone_every = 100
